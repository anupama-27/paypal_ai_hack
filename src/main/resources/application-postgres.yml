# Activate with SPRING_PROFILES_ACTIVE=postgres (e.g. on Render)
spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  jpa:
    hibernate:
      # Tables come from db/schema.sql; Hibernate only checks they match the entities.
      ddl-auto: validate
  h2:
    console:
      enabled: false
