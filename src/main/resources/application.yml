spring:
  application:
    name: cashflow-ai
  # Reads KEY=value pairs from a local .env file if present (never commit it).
  config:
    import: optional:file:.env[.properties]
  datasource:
    # Render-style JDBC_DATABASE_URL wins, then DATABASE_URL, then local defaults.
    url: ${JDBC_DATABASE_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:cashflow}}}
    username: ${DATABASE_USERNAME:cashflow}
    password: ${DATABASE_PASSWORD:cashflow}
  sql:
    init:
      mode: always
      schema-locations: classpath:db/schema.sql
  jpa:
    hibernate:
      # Tables come from db/schema.sql; Hibernate only checks they match the entities.
      ddl-auto: validate
    open-in-view: false

server:
  port: ${PORT:8080}
  error:
    # Lets the UI show validation messages (e.g. "time must look like 14:30").
    include-message: always

paypal:
  base-url: https://api-m.sandbox.paypal.com
  client-id: ${PAYPAL_CLIENT_ID:}
  client-secret: ${PAYPAL_CLIENT_SECRET:}
  # false = PayPal calls are skipped and logged (lets you work without credentials)
  enabled: ${PAYPAL_ENABLED:false}
  # Sandbox PERSONAL account email that receives demo invoices
  demo-buyer-email: ${PAYPAL_DEMO_BUYER_EMAIL:}
  # Developer Dashboard -> your app -> Webhooks -> Webhook ID (needed to verify signatures)
  webhook-id: ${PAYPAL_WEBHOOK_ID:}

cashflow:
  # Where the React app runs; used for Fix & Pay links in reminders
  app-base-url: ${CASHFLOW_APP_BASE_URL:http://localhost:5173}
  cors-origins: ${CASHFLOW_CORS_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173,http://127.0.0.1:3000}
  demo:
    # Reset / advance-time / simulate-payment endpoints. Turn off for a real deployment.
    enabled: ${CASHFLOW_DEMO_ENABLED:true}
  followup:
    days: 3
    interval-ms: 60000
  autonomy:
    suggest-after: 3
  payment-plan:
    max-installments: 2
    max-days: 30
    min-first-share: 0.50
  promise:
    max-days: 14
  agent:
    max-steps: 8
  llm:
    # Leave the key empty to use the scripted stand-in (no AI calls, no cost).
    api-key: ${CASHFLOW_LLM_API_KEY:}
    # groq = any OpenAI-compatible endpoint; anthropic = Anthropic Messages API
    provider: ${CASHFLOW_LLM_PROVIDER:groq}
    # Check the provider's docs for the exact current model id.
    model: ${CASHFLOW_LLM_MODEL:openai/gpt-oss-120b}
    base-url: ${CASHFLOW_LLM_BASE_URL:https://api.groq.com/openai/v1}
